<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة اقتراحات الأدوات الذكية</title>

  <!-- منع الوميض + مزامنة الثيم مع الصفحة الرئيسية -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("site_theme");
      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
      document.addEventListener("DOMContentLoaded", () => {
        if (savedTheme === "dark") {
          document.body.classList.add("dark-mode");
        }
      });
    })();
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;

      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --secondary: #2563eb;
      --secondary-dark: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;

      --bg: #f0f4f8;
      --bg-2: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #1e293b;
      --text-2: #475569;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --border-2: #e2e8f0;

      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 8px 16px rgba(15, 23, 42, 0.12);
      --shadow-lg: 0 12px 30px rgba(15, 23, 42, 0.16);

      --input-bg: #ffffff;
      --input-text: #1e293b;
      --placeholder: #94a3b8;
    }

    html.dark-mode {
      color-scheme: dark;

      --bg: #0f172a;
      --bg-2: #111827;
      --surface: #1e293b;
      --surface-2: #0f172a;
      --text: #e2e8f0;
      --text-2: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #334155;
      --border-2: #1f2937;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.32);
      --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.42);

      --input-bg: #0f172a;
      --input-text: #e2e8f0;
      --placeholder: #64748b;
    }

    body {
      font-family: 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark-mode {
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 40px 20px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 1.1rem;
      color: var(--text-2);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card,
    .suggestion-card,
    .toast {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }

    .card:hover,
    .suggestion-card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-2);
      background: var(--surface);
    }

    .card-header h2 {
      font-size: 1.3rem;
      margin-bottom: 5px;
      color: var(--text);
    }

    .card-header p {
      font-size: 0.9rem;
      color: var(--text-2);
    }

    .card-body {
      padding: 20px;
      background: var(--surface);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--input-text);
      background: var(--input-bg);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--placeholder);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.14);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      box-shadow: 0 8px 16px rgba(124, 58, 237, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(124, 58, 237, 0.32);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .suggestions-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .suggestion-card {
      padding: 20px;
    }

    .suggestion-card:hover {
      transform: translateY(-2px);
    }

    .suggestion-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .suggestion-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .suggestion-category {
      display: inline-block;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.12) 0%, rgba(37, 99, 235, 0.12) 100%);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .suggestion-description {
      color: var(--text-2);
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .suggestion-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-2);
      border-top: 1px solid var(--border-2);
      padding-top: 12px;
      gap: 12px;
    }

    .suggestion-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .vote-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-2);
      font-weight: 600;
      transition: all 0.3s ease;
      padding: 0;
      white-space: nowrap;
    }

    .vote-btn:hover {
      color: var(--danger);
    }

    .vote-btn.voted {
      color: var(--danger);
    }

    .vote-btn.voted svg {
      fill: currentColor;
    }

    .suggestion-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .action-btn {
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      transition: 0.3s ease;
    }

    .edit-btn {
      background: rgba(37, 99, 235, 0.12);
      color: #2563eb;
    }

    .edit-btn:hover {
      background: rgba(37, 99, 235, 0.2);
      transform: translateY(-1px);
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      transform: translateY(-1px);
    }

    .search-filter {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .search-filter {
        grid-template-columns: 1fr;
      }
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper input {
      padding-right: 40px;
    }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-2);
      pointer-events: none;
    }

    .clear-search {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-2);
      font-size: 1.2rem;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-2);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .empty-state h3 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--text);
    }

    @media (min-width: 769px) {
      .form-card {
        position: sticky;
        top: 20px;
      }
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 20px;
      border-radius: 8px;
      z-index: 10000;
      animation: slideIn 0.3s ease;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border-2);
      box-shadow: var(--shadow-md);
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left: 4px solid var(--danger);
    }

    .result-count {
      font-size: 0.9rem;
      color: var(--text-2);
      margin-top: 10px;
    }

    a {
      color: inherit;
    }

    ::selection {
      background: rgba(124, 58, 237, 0.22);
      color: var(--text);
    }
  </style>

  <!-- الترجمة -->
  <script src="translate.js" defer></script>
  <script src="translations-complete.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>منصة اقتراحات الأدوات الذكية</h1>
      <p>شارك أفكارك واكتشف أدوات جديدة مع المجتمع</p>
    </div>

    <div class="main-grid">
      <div class="form-card card">
        <div class="card-header">
          <h2>اقتراح أداة جديدة</h2>
          <p>شارك أداة مفيدة مع المجتمع</p>
        </div>
        <div class="card-body">
          <form id="suggestionForm">
            <div class="form-group">
              <label for="toolName">اسم الأداة</label>
              <input type="text" id="toolName" placeholder="مثال: ChatGPT" required>
            </div>

            <div class="form-group">
              <label for="description">الوصف</label>
              <textarea id="description" placeholder="اكتب وصفاً قصيراً للأداة..." required></textarea>
            </div>

            <div class="form-group">
              <label for="category">الفئة</label>
              <select id="category" required>
                <option value="">اختر فئة</option>
                <option value="أدوات الذكاء الاصطناعي">أدوات الذكاء الاصطناعي</option>
                <option value="أدوات الإنتاجية">أدوات الإنتاجية</option>
                <option value="أدوات التصميم">أدوات التصميم</option>
                <option value="أدوات البرمجة">أدوات البرمجة</option>
                <option value="أدوات التسويق">أدوات التسويق</option>
                <option value="أدوات التحليل">أدوات التحليل</option>
                <option value="أدوات الاتصالات">أدوات الاتصالات</option>
                <option value="أخرى">أخرى</option>
              </select>
            </div>

            <div class="form-group">
              <label for="submitterName">اسمك</label>
              <input type="text" id="submitterName" placeholder="أدخل اسمك" required>
            </div>

            <div class="form-group">
              <label for="submitterEmail">بريدك الإلكتروني</label>
              <input type="email" id="submitterEmail" placeholder="your@email.com" required>
            </div>

            <button type="submit" class="btn btn-primary">
              <span id="submitText">إضافة الاقتراح</span>
            </button>
          </form>
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom: 20px;">
          <div class="card-header">
            <h2>للتصويت وإدارة اقتراحاتك</h2>
          </div>
          <div class="card-body">
            <input type="email" id="voterEmail" placeholder="أدخل بريدك الإلكتروني للتصويت والتعديل" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); color: var(--input-text);">
          </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
          <div class="card-header">
            <h2>البحث والفلترة</h2>
          </div>
          <div class="card-body">
            <div class="search-filter">
              <div class="search-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
                  <circle cx="8" cy="8" r="6"></circle>
                  <path d="M12 12l4 4"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="ابحث عن أداة...">
                <button class="clear-search" id="clearSearch" style="display: none;">✕</button>
              </div>
              <select id="categoryFilter">
                <option value="">جميع الفئات</option>
                <option value="أدوات الذكاء الاصطناعي">أدوات الذكاء الاصطناعي</option>
                <option value="أدوات الإنتاجية">أدوات الإنتاجية</option>
                <option value="أدوات التصميم">أدوات التصميم</option>
                <option value="أدوات البرمجة">أدوات البرمجة</option>
                <option value="أدوات التسويق">أدوات التسويق</option>
                <option value="أدوات التحليل">أدوات التحليل</option>
                <option value="أدوات الاتصالات">أدوات الاتصالات</option>
                <option value="أخرى">أخرى</option>
              </select>
            </div>
            <div class="result-count" id="resultCount"></div>
          </div>
        </div>

        <div id="suggestionsContainer" class="suggestions-container">
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <h3>لا توجد اقتراحات حتى الآن</h3>
            <p>كن أول من يقترح أداة!</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const suggestions = JSON.parse(localStorage.getItem('suggestions')) || [];
    const votes = JSON.parse(localStorage.getItem('votes')) || [];

    const form = document.getElementById('suggestionForm');
    const suggestionsContainer = document.getElementById('suggestionsContainer');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const clearSearchBtn = document.getElementById('clearSearch');
    const voterEmail = document.getElementById('voterEmail');
    const resultCount = document.getElementById('resultCount');

    function normalizeEmail(email) {
      return String(email || '').trim().toLowerCase();
    }

    function saveSuggestions() {
      localStorage.setItem('suggestions', JSON.stringify(suggestions));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const toolName = document.getElementById('toolName').value.trim();
      const description = document.getElementById('description').value.trim();
      const category = document.getElementById('category').value;
      const submitterName = document.getElementById('submitterName').value.trim();
      const submitterEmail = normalizeEmail(document.getElementById('submitterEmail').value);

      if (!toolName || !description || !category || !submitterName || !submitterEmail) {
        showToast('جميع الحقول مطلوبة', 'error');
        return;
      }

      const newSuggestion = {
        id: Date.now(),
        toolName,
        description,
        category,
        submitterName,
        submitterEmail,
        votesCount: 0,
        createdAt: new Date().toISOString()
      };

      suggestions.unshift(newSuggestion);
      saveSuggestions();

      showToast('تم إضافة الاقتراح بنجاح!', 'success');
      form.reset();
      renderSuggestions();
    });

    searchInput.addEventListener('input', (e) => {
      clearSearchBtn.style.display = e.target.value ? 'block' : 'none';
      renderSuggestions();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      renderSuggestions();
    });

    categoryFilter.addEventListener('change', renderSuggestions);
    voterEmail.addEventListener('input', renderSuggestions);
    voterEmail.addEventListener('change', () => {
      localStorage.setItem('voterEmail', voterEmail.value);
    });

    function renderSuggestions() {
      const searchQuery = searchInput.value.toLowerCase().trim();
      const selectedCategory = categoryFilter.value;
      const currentEmail = normalizeEmail(voterEmail.value);

      const filtered = suggestions
        .filter(s => {
          const matchesSearch =
            s.toolName.toLowerCase().includes(searchQuery) ||
            s.description.toLowerCase().includes(searchQuery) ||
            s.submitterName.toLowerCase().includes(searchQuery);

          const matchesCategory = !selectedCategory || s.category === selectedCategory;

          return matchesSearch && matchesCategory;
        })
        .sort((a, b) => b.votesCount - a.votesCount);

      if (searchQuery || selectedCategory) {
        resultCount.textContent = `عدد النتائج: ${filtered.length}`;
      } else {
        resultCount.textContent = '';
      }

      if (filtered.length === 0) {
        suggestionsContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <h3>${suggestions.length === 0 ? 'لا توجد اقتراحات حتى الآن' : 'لا توجد نتائج تطابق البحث'}</h3>
            <p>${suggestions.length === 0 ? 'كن أول من يقترح أداة!' : 'جرب بحثاً آخر'}</p>
          </div>
        `;
        return;
      }

      suggestionsContainer.innerHTML = filtered.map(suggestion => {
        const hasVoted = votes.some(v => v.suggestionId === suggestion.id && normalizeEmail(v.voterEmail) === currentEmail);
        const canManage = currentEmail && currentEmail === normalizeEmail(suggestion.submitterEmail);

        return `
          <div class="suggestion-card">
            <div class="suggestion-header">
              <div>
                <div class="suggestion-title">${escapeHtml(suggestion.toolName)}</div>
                <span class="suggestion-category">${escapeHtml(suggestion.category)}</span>
              </div>
              <button class="vote-btn ${hasVoted ? 'voted' : ''}" onclick="handleVote(${suggestion.id})">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
                    <path d="M10 18.5s-7-4-7-9c0-3 2-5 5-5s2 1 2 1s0-1 2-1c3 0 5 2 5 5c0 5-7 9-7 9z"></path>
                </svg>
                <span>${suggestion.votesCount}</span>
              </button>
            </div>

            <div class="suggestion-description">${escapeHtml(suggestion.description)}</div>

            <div class="suggestion-footer">
              <div class="suggestion-meta">
                <span>من: ${escapeHtml(suggestion.submitterName)}</span>
                <span>${new Date(suggestion.createdAt).toLocaleDateString('ar-SA')}</span>
              </div>

              <div class="suggestion-actions">
                ${canManage ? `
                  <button class="action-btn edit-btn" onclick="editSuggestion(${suggestion.id})">✏️ تعديل</button>
                  <button class="action-btn delete-btn" onclick="deleteSuggestion(${suggestion.id})">🗑 حذف</button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleVote(suggestionId) {
      const email = normalizeEmail(voterEmail.value);

      if (!email) {
        showToast('يرجى إدخال بريدك الإلكتروني للتصويت', 'error');
        return;
      }

      const hasVoted = votes.some(v => v.suggestionId === suggestionId && normalizeEmail(v.voterEmail) === email);
      if (hasVoted) {
        showToast('لقد صوتت بالفعل على هذا الاقتراح', 'error');
        return;
      }

      const suggestion = suggestions.find(s => s.id === suggestionId);
      if (!suggestion) return;

      suggestion.votesCount++;
      votes.push({
        suggestionId,
        voterEmail: email,
        timestamp: new Date().toISOString()
      });

      localStorage.setItem('votes', JSON.stringify(votes));
      saveSuggestions();
      showToast('شكراً لتصويتك!', 'success');
      renderSuggestions();
    }

    function editSuggestion(id) {
      const currentEmail = normalizeEmail(voterEmail.value);
      const suggestion = suggestions.find(s => s.id === id);

      if (!suggestion) return;

      if (!currentEmail || currentEmail !== normalizeEmail(suggestion.submitterEmail)) {
        showToast('فقط صاحب الاقتراح يقدر يعدل عليه', 'error');
        return;
      }

      const newToolName = prompt('تعديل اسم الأداة', suggestion.toolName);
      if (newToolName === null) return;

      const newDescription = prompt('تعديل الوصف', suggestion.description);
      if (newDescription === null) return;

      const trimmedToolName = newToolName.trim();
      const trimmedDescription = newDescription.trim();

      if (!trimmedToolName || !trimmedDescription) {
        showToast('الاسم والوصف لا يمكن أن يكونا فارغين', 'error');
        return;
      }

      suggestion.toolName = trimmedToolName;
      suggestion.description = trimmedDescription;

      saveSuggestions();
      showToast('تم تعديل الاقتراح', 'success');
      renderSuggestions();
    }

    function deleteSuggestion(id) {
      const currentEmail = normalizeEmail(voterEmail.value);
      const index = suggestions.findIndex(s => s.id === id);

      if (index === -1) return;

      if (currentEmail !== normalizeEmail(suggestions[index].submitterEmail)) {
        showToast('فقط صاحب الاقتراح يقدر يحذفه', 'error');
        return;
      }

      const confirmed = confirm('هل أنت متأكد من حذف الاقتراح؟');
      if (!confirmed) return;

      suggestions.splice(index, 1);
      saveSuggestions();
      showToast('تم حذف الاقتراح', 'success');
      renderSuggestions();
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    const storedVoterEmail = localStorage.getItem('voterEmail');
    if (storedVoterEmail) {
      voterEmail.value = storedVoterEmail;
    }

    renderSuggestions();
  </script>

  <script>
    if (localStorage.getItem("site_theme") === "dark") {
      document.documentElement.classList.add("dark-mode");
      document.addEventListener("DOMContentLoaded", () => document.body.classList.add("dark-mode"));
    }
  </script>

  <!-- الترجمة -->
  <script src="translate.js" defer></script>
  <script src="translations-complete.js" defer></script>
</body>
</html>
